name: Import, build and deploy CAF Release Archive

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reimport:
        description: "Re-download and re-parse the pinned Wayback snapshot"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: caf-release-archive-pages
  cancel-in-progress: false

jobs:
  archive-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install importer dependencies
        run: python -m pip install -r requirements.txt

      - name: Decide whether to import the source snapshot
        id: import-check
        shell: bash
        env:
          REIMPORT: ${{ inputs.reimport }}
        run: |
          if [[ ! -s data/releases.json || "$REIMPORT" == "true" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Import required."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Existing data/releases.json found; keeping the committed dataset."
          fi

      - name: Download and parse pinned Wayback snapshot
        if: steps.import-check.outputs.needed == 'true'
        run: python scripts/import_snapshot.py

      - name: Validate imported dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/releases.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("ERROR: data/releases.json is missing or empty")

          payload = json.loads(path.read_text(encoding="utf-8"))
          records = payload.get("records")
          if not isinstance(records, list) or len(records) < 100:
              raise SystemExit("ERROR: dataset is missing or unexpectedly small")

          required = ("date", "tag", "chipset", "manifest", "android_version")
          malformed = [
              i for i, row in enumerate(records, 1)
              if not isinstance(row, dict) or any(k not in row for k in required)
          ]
          if malformed:
              raise SystemExit(f"ERROR: malformed records at positions {malformed[:10]}")

          print(f"Validated {len(records):,} release records.")
          PY

      - name: Commit imported source and data
        if: steps.import-check.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/source.html data/releases.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Import archived CodeAurora release table"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build static website
        run: python scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
